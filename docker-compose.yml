services:

  mysql:

    image: mysql:8.0

    container_name: ors-mysql

    restart: always

    environment:

      MYSQL_ROOT_PASSWORD: root

      MYSQL_DATABASE: project_10

    ports:

      - "3308:3306"

    volumes:

      - mysql_data:/var/lib/mysql

    healthcheck:

      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]

      interval: 5s

      timeout: 5s

      retries: 10


  backend:

    build:

      context: ./ORSProject-10       # 👈 backend folder

      dockerfile: Dockerfile

    container_name: ors-backend

    depends_on:

      mysql:

        condition: service_healthy

    ports:

      - "8080:8081"


  frontend:

    build:

      context: ./ORSPROJECT-10-UI # 👈 IMPORTANT FIX

      dockerfile: Dockerfile

    container_name: ors-frontend

    depends_on:

      - backend

    ports:

      - "4200:80"


volumes:

  mysql_data: